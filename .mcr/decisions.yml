# multi-code-review decisions. Reviewed like code; matched on every review.
#
# These are the decisions for reviewing multi-code-review's own code (self-review.yml,
# `mcr review .`). They do not apply to repos you review with it: the gateway reads
# .mcr/decisions.yml from the repo under review, and yours starts empty
# (record_decisions or triage_queue writes it). Kept here as a working example.
#
# action: fix (keep on the to-fix list) | accept (norm broken on purpose: inform, never block)
#         false-positive (the tool is wrong here) | disable (this rule does not apply: hide it)
# match:  rule (analyzer:ruleId), plus fingerprint (one occurrence) or paths (globs).
version: 1
decisions:
  - id: D-0001
    action: false-positive
    match:
      rule: semgrep:typescript.mcp.security.mcp-ssrf-typescript
      paths:
        - gateway/src/server.ts
    reason: The rule's `$AXIOS($URL, ...)` sink matches every function call whose first argument derives from a tool argument, so every handler line is flagged. In server.ts tool arguments only reach resolveRepo, git and file reads; the gateway's only fetch calls (analyzers.ts, jev.ts) take their URLs from MCR_ANALYZERS / the catalog and MCR_JEV_URL, never from a request.
    ref: https://github.com/phassle/multi-code-review/pull/5
    decided_on: 2026-10-13
  - id: D-0002
    action: false-positive
    match:
      rule: semgrep:javascript.jquery.security.audit.prohibit-jquery-html
      fingerprint: 34491b02f6da7fbe509e84c0fc9c533b58c4cbc60f719b1a5c2dba299c933f91
      paths:
        - gateway/tests/html.test.ts
    reason: "`html` here is the gateway's own escaping template tag (gateway/src/html.ts), not jQuery's .html()."
    ref: https://github.com/phassle/multi-code-review/pull/5
    decided_on: 2026-10-13
  - id: D-0003
    action: false-positive
    match:
      rule: semgrep:javascript.lang.security.html-in-template-string
      paths:
        - scripts/github-review.mjs
    reason: Builds GitHub-flavoured Markdown for the reviews API; GitHub sanitizes it, nothing is rendered as raw HTML in a browser
    ref: https://github.com/phassle/multi-code-review/pull/8
    decided_on: 2026-10-14

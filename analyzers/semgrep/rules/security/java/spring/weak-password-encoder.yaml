rules:
- id: weak-password-encoder
  message: >-
    This PasswordEncoder stores passwords in plain text or with a fast, unsalted
    hash. Use PasswordEncoderFactories.createDelegatingPasswordEncoder() or
    BCrypt/Argon2/SCrypt/Pbkdf2.
  severity: ERROR
  languages: [java]
  metadata:
    category: security
    subcategory: [vuln]
    likelihood: HIGH
    impact: HIGH
    cwe: ["CWE-916: Use of Password Hash With Insufficient Computational Effort"]
    owasp: ["A02:2021 - Cryptographic Failures"]
    confidence: HIGH
    references: ["https://docs.spring.io/spring-security/reference/features/authentication/password-storage.html"]
    technology: [spring]
  pattern-either:
  - pattern: NoOpPasswordEncoder.getInstance()
  - pattern: new StandardPasswordEncoder(...)
  - pattern: new MessageDigestPasswordEncoder(...)
  - pattern: new LdapShaPasswordEncoder(...)
  - pattern: new Md4PasswordEncoder(...)

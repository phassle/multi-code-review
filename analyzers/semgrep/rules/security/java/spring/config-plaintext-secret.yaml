rules:
- id: config-plaintext-secret
  message: >-
    A password or secret is written into Spring config. Read it from the
    environment or a secret store instead, e.g. ${DB_PASSWORD}, or encrypt it
    for Spring Cloud Config ({cipher}…).
  severity: WARNING
  languages: [generic]
  paths:
    include: ["application*.properties", "application*.yml", "application*.yaml", "bootstrap*.properties", "bootstrap*.yml", "bootstrap*.yaml"]
    exclude: ["*-local.*", "*-dev.*", "*-test.*", "**/src/test/**"]
  metadata:
    category: security
    subcategory: [vuln]
    likelihood: MEDIUM
    impact: HIGH
    cwe: ["CWE-798: Use of Hard-coded Credentials"]
    owasp: ["A07:2021 - Identification and Authentication Failures"]
    confidence: MEDIUM
    references: ["https://docs.spring.io/spring-boot/reference/features/external-config.html"]
    technology: [spring]
  pattern-regex: (?im)^[ \t]*[\w.-]*(password|secret|client-secret|api-key)[ \t]*[=:][ \t]*(?!["']?\$\{|["']?\{cipher\}|""|''|[ \t]*$|[ \t]*#)\S+

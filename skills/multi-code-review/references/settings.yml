# Copy to .mcr/settings.yml in a reviewed repo. Commit it; it is reviewed like code.
#
# off      not reviewed
# minimum  analyzers only; only high severity shown; high blocks
# medium   analyzers + LLM reviewer (not on trivial diffs); high and medium shown; high blocks (default)
# maximum  analyzers + LLM reviewer on every diff; everything shown; high and medium block
review:
  security: maximum
  architecture: medium
  best-practices: minimum
  testing: medium
  correctness: medium
  reliability: medium

# Claude Code (with this repo as a plugin): an agent may not finish its turn
# while the review blocks; its Stop hook sends the blocking findings back.
# Fails open when the gateway is down, hands over to you after 3 rounds.
agent:
  gate: true
